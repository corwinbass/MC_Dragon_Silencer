plugins {
    id 'java'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.17"
}

repositories {
    mavenCentral()
    maven { url = "https://repo.dmulloy2.net/nexus/repository/public/" }
    maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots" }
    maven { url = "https://hub.spigotmc.org/nexus/content/groups/public/" }
}

dependencies {
    paperweight.paperDevBundle(libs.versions.io.papermc.paper)
    compileOnly "com.comphenix.protocol:ProtocolLib:5.4.0"
}

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

version = "1.4"
description = "Prevents sound of dying enderdragon to be played to whole server, end dimension only"
ext.url = "https://github.com/corwinbass/MC_Dragon_Silencer"

processResources {
    filesMatching('plugin.yml') {
        expand(projectName: project.name,
               version: project.version,
               projectDescription: project.description,
               url: project.url
        )
    }
}